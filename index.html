<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    
    <title>Ai Performance Tacker</title>

   
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    
    <h1>Ai Growth Tracker</h1>
    
    <p>Business Trends and Outlook Survey (Census BtOS)</p>

    
    <button id="loadPopulationBtn">Load Data</button>
    
    <p id="loadInfo"></p>

  
    <table id="populationTable" class="hidden">
        
        <thead>
            <tr>
                <th>Period</th>
                <th>Date Range</th>
                <th>State</th>
                <th>NAICS</th>
                <th>Question</th>
                <th>Answer</th>
                <th>Estimate %</th>
                <th>Std Error</th>
            </tr>
        </thead>
   
        <tbody></tbody>
    </table>

    <script src="script.js"></script>
</body>
</html>
